<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TONARI — コール&レスポンス</title><link rel="stylesheet" href="./phone.css"><link rel="stylesheet" href="./call-response.css"><link rel="stylesheet" href="./kawaii.css"></head><body><main><header><span class="wordmark">TONARI</span><a href="./index.html">デモへ</a></header><p class="label">ひとりライブ</p><h1>もものコールを、<br>光で返そう。</h1><tonari-guide state="waiting" compact></tonari-guide><section class="call-card"><div class="score"><strong id="round">コール 1</strong><span id="accuracy">3拍・100 BPM</span></div><div id="pulse" aria-hidden="true"></div><div id="ticker" aria-label="コール再生位置"></div><p id="call-status" role="status">端末を8タップで調整すると始まります。</p><div id="pads" aria-label="4色のレスポンスパッド"><button data-pad="0" aria-label="桃色の丸">●</button><button data-pad="1" aria-label="青色の三角">▲</button><button data-pad="2" aria-label="黄色の四角">■</button><button data-pad="3" aria-label="緑色の星">★</button></div><button id="start">端末を8タップで調整</button><button id="retry" class="secondary" hidden>もう一回</button></section><p id="offline-status" class="fine" role="status">通信なしで開き直す準備をしています。</p><p class="fine">音は鳴りません。練習は何度でもでき、特典や連続記録はありません。となりとの署名QRラリーは次の接続です。</p></main><script type="module" src="./call-response-ui.mjs"></script><script type="module" src="./mascots.mjs"></script></body></html>
