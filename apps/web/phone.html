<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="./phone.css"><title>TONARI 端末</title><link rel="stylesheet" href="./kawaii.css"><link rel="stylesheet" href="./picture-board.css"></head><body><main>
<header><span class="wordmark">TONARI</span><span id="identity">準備中</span></header><div class="chapter"><span>01 / 列のなか</span><span>音なし</span></div>
<h1>今日の思い出を、<br>少しずつ。</h1><p class="hint">あと一枚は、となりにあるかも。</p>
<tonari-guide state="waiting" compact></tonari-guide><div class="board" id="board" aria-label="24枚の思い出ボード"></div>
<div class="progress"><span>出会いのスケッチ</span><span id="count">準備中</span></div><p class="fine" id="allocation-note">通常ピースはショーと端末鍵から等確率で再現できるように選びます。レアは別の混雑ガバナーが管理します。</p>
<section class="exchange"><p class="label">となりのひとと</p><p class="status" id="status" role="status">この端末だけの鍵をつくっています。</p><button id="offer" disabled>交換を頼む <span>↗</span></button><button id="accept" hidden>内容を確認して受け取る</button></section>
<p class="key" id="key">鍵を準備中</p><p class="fine">開発用の模擬端末 · 受け取りは仮状態<br>このブラウザーに鍵と記録を保存します。<br>サイトデータを削除すると復元できません。</p>
</main><script type="module" src="./phone.mjs"></script><script type="module" src="./mascots.mjs"></script></body></html>
